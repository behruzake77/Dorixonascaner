<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.9" />
    </linearGradient>
  </defs>

  <!-- Asosiy doira (background) -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" />

  <!-- Ichki doira (subtle ring) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Dori kapsulasi (pill) — chap tomon -->
  <g transform="translate(160, 140) rotate(-30, 60, 100)">
    <!-- Kapsula yuqori qismi (oq) -->
    <rect x="30" y="20" width="60" height="100" rx="30" fill="url(#pill)" />
    <!-- Kapsula pastki qismi (yashil) -->
    <rect x="30" y="120" width="60" height="100" rx="30" fill="url(#scan)" />
    <!-- Kapsula chizig'i -->
    <line x1="30" y1="120" x2="90" y2="120" stroke="rgba(0,0,0,0.1)" stroke-width="2"/>
  </g>

  <!-- Shtrix-kod chiziqlari -->
  <g transform="translate(230, 160)">
    <!-- Uzun chiziqlar -->
    <rect x="0" y="0" width="4" height="120" rx="1" fill="white" opacity="0.9"/>
    <rect x="12" y="0" width="3" height="120" rx="1" fill="white" opacity="0.9"/>
    <rect x="22" y="0" width="5" height="120" rx="1" fill="white" opacity="0.9"/>
    <rect x="34" y="0" width="3" height="120" rx="1" fill="white" opacity="0.9"/>
    <rect x="44" y="0" width="4" height="120" rx="1" fill="white" opacity="0.9"/>
    <rect x="56" y="0" width="3" height="120" rx="1" fill="white" opacity="0.9"/>
    <rect x="66" y="0" width="5" height="120" rx="1" fill="white" opacity="0.9"/>
    <rect x="78" y="0" width="3" height="120" rx="1" fill="white" opacity="0.9"/>
    <rect x="88" y="0" width="4" height="120" rx="1" fill="white" opacity="0.9"/>
    <rect x="100" y="0" width="3" height="120" rx="1" fill="white" opacity="0.9"/>
    <rect x="110" y="0" width="5" height="120" rx="1" fill="white" opacity="0.9"/>
    <rect x="122" y="0" width="3" height="120" rx="1" fill="white" opacity="0.9"/>
    <rect x="132" y="0" width="4" height="120" rx="1" fill="white" opacity="0.9"/>
  </g>

  <!-- Skanerlash chizig'i (yashil lazer) -->
  <g transform="translate(225, 200)">
    <rect x="0" y="0" width="145" height="3" rx="1.5" fill="#10b981" opacity="0.8"/>
    <!-- Glow effekti -->
    <rect x="0" y="-2" width="145" height="7" rx="3.5" fill="#10b981" opacity="0.2"/>
  </g>

  <!-- Crosshair (kichik) -->
  <g transform="translate(297, 201)" stroke="white" stroke-width="1.5" opacity="0.6">
    <line x1="-8" y1="0" x2="-3" y2="0"/>
    <line x1="3" y1="0" x2="8" y2="0"/>
    <line x1="0" y1="-8" x2="0" y2="-3"/>
    <line x1="0" y1="3" x2="0" y2="8"/>
  </g>

  <!-- Pastki matn yo'li (dori) -->
  <text x="256" y="420" text-anchor="middle" fill="white" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" opacity="0.9">DORIXONA</text>
  <text x="256" y="450" text-anchor="middle" fill="white" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" opacity="0.6">SKANER</text>
</svg>
